# Локальный стенд: Postgres (TimescaleDB, как на проде) + Redis.
# Запуск: docker compose -f dev/docker-compose.yml up -d
# Данные: bash dev/pull-db.sh — справочники с прода, без заказов и клиентов.
name: arryt-dev

services:
  postgres:
    image: timescale/timescaledb:2.29.2-pg18
    environment:
      POSTGRES_USER: arryt
      POSTGRES_PASSWORD: arryt
      POSTGRES_DB: arryt
    ports:
      # 5432 на этой машине уже занят
      - "127.0.0.1:5433:5432"
    volumes:
      # PG18: том на /var/lib/postgresql, данные лягут в подкаталог версии
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arryt -d arryt"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:
